version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 99
    cooldown:
      default-days: 7
    ignore:
      # https://github.com/mozilla/addons-scanner-utils/issues/1170
      - dependency-name: eslint
        versions:
          - ">= 10"
      # https://github.com/mozilla/addons-scanner-utils/issues/1171
      - dependency-name: typescript
        versions:
          - ">= 6"
      # https://github.com/mozilla/addons-scanner-utils/issues/1172
      - dependency-name: strip-bom-stream
        versions:
          - ">= 5"
    groups:
      # Keep it first so that a dependency belonging to more than a
      # group ends up in this group instead of a different group when
      # it has a new "patch" version.
      all-patch-releases:
        patterns:
          - "*"
        update-types:
          - patch
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
    groups:
      ssdlc-actions:
        patterns:
          - "mozilla/ssdlc-actions/*"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 99
